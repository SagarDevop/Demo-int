<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" fill="none" stroke="#222222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dimension lines at top -->
    <line x1="60" y1="20" x2="390" y2="20" />
    <line x1="60" y1="15" x2="60" y2="25" />
    <line x1="160" y1="15" x2="160" y2="25" />
    <line x1="290" y1="15" x2="290" y2="25" />
    <line x1="390" y1="15" x2="390" y2="25" />
    <text x="110" y="16" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle">450</text>
    <text x="225" y="16" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle">750</text>
    <text x="340" y="16" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle">450</text>
    <text x="225" y="32" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle">1650 mm</text>

    <!-- Floor plan outline -->
    <rect x="60" y="45" width="330" height="130" stroke="#111" stroke-width="1.5" />
    <!-- Interior partitions -->
    <line x1="180" y1="45" x2="180" y2="120" stroke="#333" stroke-width="1.2" />
    <line x1="180" y1="120" x2="250" y2="120" stroke="#333" stroke-width="1.2" />
    <line x1="290" y1="80" x2="390" y2="80" stroke="#333" stroke-width="1.2" />
    <!-- Door swings -->
    <path d="M180 145 A 25 25 0 0 1 205 170" stroke-dasharray="2 2" />
    <line x1="180" y1="145" x2="180" y2="170" />

    <!-- Dimension labels & room markers -->
    <text x="120" y="100" font-family="sans-serif" font-size="10" font-weight="600" fill="#222" text-anchor="middle">LIVING SUITE</text>
    <text x="120" y="115" font-family="sans-serif" font-size="8" fill="#777" text-anchor="middle">24.5 m²</text>

    <text x="335" y="65" font-family="sans-serif" font-size="9" font-weight="600" fill="#222" text-anchor="middle">DINING / LOUNGE</text>
    <text x="335" y="130" font-family="sans-serif" font-size="9" font-weight="600" fill="#222" text-anchor="middle">MASTER SUITE</text>
  </svg>